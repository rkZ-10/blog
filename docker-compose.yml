services:
  mariadb:
    image: mariadb:12.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FORWARD_DB_PORT:-3306}:3306"
    environment:
      MARIADB_ROOT_PASSWORD: "${DB_PASSWORD:-secret}"
      MARIADB_DATABASE: "${DB_DATABASE:-blog}"
      MARIADB_USER: "${DB_USERNAME:-blog}"
      MARIADB_PASSWORD: "${DB_PASSWORD:-secret}"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mariadb-data:
  redis-data:
